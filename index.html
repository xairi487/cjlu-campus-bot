<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#153a63">
<meta name="description" content="中国计量大学校园问答机器人">
<title>中量大校园问答</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#17243a;background:#edf2f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#d8e7f5 0,transparent 38%),#edf2f7}.shell{max-width:900px;min-height:100vh;margin:auto;padding:28px 22px;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:14px;padding:8px 2px 22px}.mark{width:48px;height:48px;border-radius:16px;background:#153a63;color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;box-shadow:0 6px 16px #153a6330}h1{font-size:21px;margin:0 0 4px;letter-spacing:.02em}.sub{font-size:13px;color:#64748b}.panel{flex:1;min-height:460px;background:#fff;border:1px solid #e1e8f0;border-radius:22px;box-shadow:0 14px 40px #17324d0d;display:flex;flex-direction:column;overflow:hidden}.intro{padding:25px 28px 14px;border-bottom:1px solid #edf1f5}.intro strong{font-size:16px}.intro p{margin:7px 0 0;color:#718096;font-size:14px;line-height:1.65}#chat{flex:1;overflow-y:auto;padding:20px 28px}.msg{display:flex;margin:12px 0}.msg.user{justify-content:flex-end}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;max-width:min(80%,600px);padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.75}.bot .bubble{background:#f1f5f9;color:#25354c;border-top-left-radius:5px}.user .bubble{background:#1d5688;color:#fff;border-top-right-radius:5px}.bottom{padding:12px 22px 20px;border-top:1px solid #edf1f5}.suggest{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.suggest button{border:1px solid #dce6ef;background:#fff;color:#345777;border-radius:20px;padding:8px 12px;font-size:13px;cursor:pointer}.suggest button:hover{background:#f1f6fa}form{display:flex;gap:10px}input{min-width:0;flex:1;border:1px solid #dbe3ec;background:#f9fbfd;border-radius:13px;padding:13px 15px;font-size:15px;outline:none}input:focus{border-color:#6390b4;box-shadow:0 0 0 3px #6390b41c}form button{border:0;border-radius:13px;background:#153a63;color:white;padding:0 23px;font-size:14px;cursor:pointer}form button:hover{background:#20527f}form button:disabled{opacity:.55}footer{padding:14px 2px 0;text-align:center;color:#8290a2;font-size:12px}footer a{color:#537493;text-decoration:none}@media(max-width:600px){.shell{padding:15px 12px}.panel{border-radius:18px}.intro{padding:20px 19px 12px}#chat{padding:15px 18px}.bottom{padding:12px 14px 15px}.bubble{max-width:90%}h1{font-size:18px}}
</style>
</head>
<body>
<main class="shell"><header><div class="mark">量</div><div><h1>中国计量大学 · 校园问答</h1><div class="sub">校园信息小助手</div></div></header><section class="panel"><div class="intro"><strong>你好，欢迎来到中量大校园问答</strong><p>可以询问学校概况、校训、地址、招生咨询等。当前为基础问答版，后续可接入智能问答 API。</p></div><div id="chat" aria-live="polite"></div><div class="bottom"><div class="suggest" id="suggestions"></div><form id="form"><input id="question" autocomplete="off" placeholder="输入你的问题…" aria-label="输入你的问题"><button id="send">发送</button></form></div></section><footer>回答仅供参考，最新信息请以<a href="https://www.cjlu.edu.cn/" target="_blank" rel="noopener">中国计量大学官网</a>及官方通知为准</footer></main>
<script>
const FAQ=[{keys:['学校全称','学校叫什么','你们学校叫什么'],answer:'学校全称是中国计量大学，简称中量大或量大，英文名称为 China Jiliang University。'},{keys:['学校在哪','学校地址','学校位置','地址是什么'],answer:'中国计量大学位于浙江省杭州市钱塘区学源街。出行前建议查看学校官网的校区位置和导航信息。'},{keys:['学校特色','办学特色','学校有什么特色'],answer:'学校以计量、标准、质量、市场监管和检验检疫为办学特色。详细介绍可查看学校官网“学校概况”。'},{keys:['校训','学校校训'],answer:'学校校训是“精思国计，细量民生”。'},{keys:['学校历史','建校时间','什么时候建校'],answer:'学校前身为1978年创建的杭州计量学校，2016年更名为中国计量大学。'},{keys:['招生电话','招生咨询电话','招生办电话'],answer:'本科招生咨询电话为 0571-86836060。招生政策和联系方式可能调整，请以本科招生网 https://zs.cjlu.edu.cn/ 的最新公告为准。'},{keys:['学校官网','官网网址','官方网站'],answer:'学校官网：https://www.cjlu.edu.cn/\n本科招生网：https://zs.cjlu.edu.cn/'},{keys:['怎么进校','进校预约','校外人员进校'],answer:'校外人员进校通常需要按学校要求预约。请查看学校官网“进校预约”入口及最新通知，具体以当日规定为准。'}];
const chat=document.querySelector('#chat'),input=document.querySelector('#question'),send=document.querySelector('#send');function add(text,who){const row=document.createElement('div');row.className='msg '+who;const b=document.createElement('div');b.className='bubble';b.textContent=text;row.append(b);chat.append(row);chat.scrollTop=chat.scrollHeight}function localAnswer(question){const q=question.replace(/[\s，。？！、,.!?：:]+/g,'').toLowerCase();let best=null,score=0;for(const item of FAQ)for(const k of item.keys){const key=k.toLowerCase();const s=q.includes(key)?100:(key.includes(q)&&q.length>1?q.length:0);if(s>score){score=s;best=item.answer}}return score>=2?best:'抱歉，我暂时没有找到这个问题的可靠答案。你可以换个问法，或到中国计量大学官网 https://www.cjlu.edu.cn/ 查询最新信息。'}
// 后续接入 API：在此添加 fetch('/api/chat', ...) 并返回服务端回答。
async function getAnswer(question){return localAnswer(question)}async function ask(q){if(!q.trim())return;add(q,'user');input.value='';send.disabled=true;try{add(await getAnswer(q),'bot')}catch(e){add('服务暂时不可用，请稍后再试。','bot')}finally{send.disabled=false;input.focus()}}document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();ask(input.value)});['学校有什么特色？','学校地址在哪里？','校训是什么？','招生咨询电话是多少？'].forEach(q=>{const b=document.createElement('button');b.type='button';b.textContent=q;b.onclick=()=>ask(q);document.querySelector('#suggestions').append(b)});add('你好！我是中量大校园问答机器人。你可以直接输入问题，也可以点击下方常见问题。','bot');
</script>
</body></html>
